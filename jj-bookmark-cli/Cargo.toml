[package]
name = "jj-bookmark-cli"
version = "0.21.0"
edition = "2024"

# 二进制名固定为 jj-bookmark（crate 目录名带 -cli 后缀以区分工程）。
[[bin]]
name = "jj-bookmark"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"
[profile.release]
lto = true
strip = true
