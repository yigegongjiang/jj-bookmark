<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>123</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c8bff'/%3E%3Ctext x='16' y='21.5' font-family='system-ui,sans-serif' font-size='13' font-weight='700' text-anchor='middle' fill='%230a0b0f'%3E123%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0b0f;
        --elev: #101219;
        --surface: #14161f;
        --surface-2: #1a1d28;
        --border: #23262f;
        --border-2: #313543;
        --fg: #e7e9f0;
        --muted: #9096a3;
        --faint: #656b78;
        --accent: #7c8bff;
        --accent-2: #96a2ff;
        --accent-soft: rgba(124, 139, 255, 0.14);
        --danger: #f87171;
        --violet: #c084fc;
        --glow: radial-gradient(60% 46% at 18% 0%, rgba(124, 139, 255, 0.14), transparent 72%);
        --shadow: 0 12px 28px -14px rgba(0, 0, 0, 0.7);
        --r: 9px;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, "PingFang SC",
          "Hiragino Sans", sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f3f4f9;
          --elev: #ffffff;
          --surface: #ffffff;
          --surface-2: #f1f3f9;
          --border: #e4e6ef;
          --border-2: #d1d5e2;
          --fg: #1b1d24;
          --muted: #5c6270;
          --faint: #868c9a;
          --accent: #4f5bd5;
          --accent-2: #3d49c2;
          --accent-soft: rgba(79, 91, 213, 0.1);
          --danger: #d3202a;
          --violet: #8b5cf6;
          --glow: radial-gradient(60% 46% at 18% 0%, rgba(79, 91, 213, 0.1), transparent 72%);
          --shadow: 0 12px 28px -18px rgba(20, 24, 60, 0.35);
        }
      }
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--border-2) transparent;
      }
      *::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      *::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border: 2px solid transparent;
        border-radius: 6px;
        background-clip: padding-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--glow), var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent-soft);
      }
      svg {
        display: block;
      }

      .page {
        min-height: 100%;
        padding: 36px 32px 64px;
      }
      .wrap {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
      }

      /* ---------- header ---------- */
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }
      .logo {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--violet));
        color: #0a0b0f;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
        box-shadow: 0 6px 20px -6px rgba(124, 139, 255, 0.5);
      }
      .titles {
        min-width: 0;
      }
      .trow {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 680;
        letter-spacing: -0.02em;
      }
      .pill {
        padding: 3px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        white-space: nowrap;
      }
      .sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }
      #status {
        margin-left: auto;
        color: var(--faint);
        font-size: 11.5px;
        white-space: nowrap;
      }
      #status.err {
        color: var(--danger);
        cursor: pointer;
      }

      /* ---------- panel ---------- */
      .panel {
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 60%), var(--elev);
      }
      .phead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }
      .ptitle {
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .search {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search .ic {
        position: absolute;
        left: 9px;
        color: var(--faint);
        pointer-events: none;
      }
      #q {
        width: 210px;
        height: 28px;
        padding: 0 26px 0 28px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 12.5px;
        outline: none;
        transition: border-color 0.15s, width 0.15s;
      }
      #q:focus {
        border-color: var(--accent);
        width: 250px;
      }
      #q::placeholder {
        color: var(--faint);
      }
      #qx {
        position: absolute;
        right: 5px;
        display: none;
        place-items: center;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--faint);
        cursor: pointer;
      }
      #qx:hover {
        background: var(--border);
        color: var(--fg);
      }
      .seg {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
      }
      .seg button {
        height: 24px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--faint);
        font: inherit;
        font-size: 11.5px;
        font-weight: 550;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .seg button:hover {
        color: var(--muted);
      }
      .seg button.on {
        background: var(--surface);
        color: var(--fg);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 11px;
        border: 1px solid var(--border-2);
        border-radius: 7px;
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 550;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .btn:hover {
        background: var(--surface-2);
        border-color: var(--accent);
        color: var(--fg);
      }
      .btn.primary {
        border-color: transparent;
        background: var(--accent);
        color: #0a0b0f;
      }
      .btn.primary:hover {
        background: var(--accent-2);
        color: #0a0b0f;
      }

      /* ---------- chips ---------- */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 25px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
      }
      .chip:hover {
        border-color: var(--border-2);
        color: var(--fg);
      }
      .chip.on {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .chip .n {
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10px;
      }
      .chip.on .n {
        color: var(--accent);
      }

      /* ---------- editor ---------- */
      .editor {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        margin-bottom: 14px;
        border: 1px solid var(--border);
        border-radius: var(--r);
        background: var(--surface);
      }
      .frow {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .in {
        height: 34px;
        min-width: 0;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--elev);
        color: var(--fg);
        font: inherit;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      .in:focus {
        border-color: var(--accent);
      }
      .in::placeholder {
        color: var(--faint);
      }
      .in.name {
        flex: 1 1 220px;
      }
      .in.url {
        flex: 2 1 340px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .in.group {
        flex: 1 1 200px;
      }
      .fact {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ferr {
        color: var(--danger);
        font-size: 12px;
      }
      .fhint {
        margin-left: auto;
        color: var(--faint);
        font-size: 11.5px;
      }

      /* ---------- sections + grid ---------- */
      .sec + .sec {
        margin-top: 22px;
      }
      .shead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 9px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--border);
      }
      .shead h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 640;
        color: var(--fg);
      }
      .shead .n {
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10.5px;
      }
      .iconbtn {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--faint);
        cursor: pointer;
        opacity: 0;
        transition: background 0.12s, color 0.12s, opacity 0.12s;
      }
      .sec:hover .iconbtn,
      .iconbtn:focus-visible {
        opacity: 1;
      }
      .iconbtn:hover {
        background: var(--surface-2);
        color: var(--fg);
      }
      .srename {
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--elev);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        font-weight: 640;
        outline: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
        gap: 10px;
      }
      .cell {
        position: relative;
        display: flex;
        min-width: 0;
      }
      .card {
        display: flex;
        flex: 1;
        align-items: flex-start;
        gap: 11px;
        min-width: 0;
        min-height: 66px;
        padding: 12px 66px 12px 12px;
        border: 1px solid var(--border);
        border-radius: var(--r);
        background: var(--surface);
        color: var(--fg);
        text-decoration: none;
        transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      }
      .card:hover {
        background: var(--surface-2);
        border-color: var(--border-2);
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 8px;
        color: #0a0b0f;
        font-size: 13px;
        font-weight: 700;
      }
      .cbody {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        gap: 5px;
      }
      .cname {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .cmeta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
        min-width: 0;
      }
      .chost {
        max-width: 100%;
        overflow: hidden;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ctag {
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-2);
        font-size: 10.5px;
        font-weight: 600;
      }
      .ops {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 3px;
        opacity: 0;
        transition: opacity 0.12s;
      }
      .cell:hover .ops,
      .cell:focus-within .ops {
        opacity: 1;
      }
      .op {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--elev);
        color: var(--faint);
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .op:hover {
        background: var(--border-2);
        color: var(--fg);
      }
      .op.del:hover {
        color: var(--danger);
      }
      .flash .card {
        animation: flash 1.6s ease-out;
      }
      @keyframes flash {
        0%,
        45% {
          border-color: var(--accent);
          box-shadow: 0 0 0 3px var(--accent-soft);
        }
      }

      .empty {
        width: 100%;
        padding: 22px;
        border: 1px dashed var(--border-2);
        border-radius: var(--r);
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 12.5px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
      }
      .empty:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--fg);
      }
      .none {
        padding: 26px 0;
        color: var(--faint);
        font-size: 12.5px;
        text-align: center;
      }
      .foot {
        margin-top: 16px;
        color: var(--faint);
        font-size: 11px;
        text-align: right;
      }
      kbd {
        padding: 1px 5px;
        border: 1px solid var(--border-2);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: var(--surface);
        font-family: var(--mono);
        font-size: 10px;
      }

      @media (max-width: 760px) {
        .page {
          padding: 22px 14px 44px;
        }
        h1 {
          font-size: 24px;
        }
        .tools {
          width: 100%;
          flex-wrap: wrap;
        }
        .search {
          flex: 1 1 100%;
        }
        #q,
        #q:focus {
          width: 100%;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .ops {
          opacity: 0.72;
        }
        .iconbtn,
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="wrap">
        <header class="top">
          <div class="logo" id="logo">123</div>
          <div class="titles">
            <div class="trow">
              <h1 id="title">123</h1>
              <span class="pill" id="count">—</span>
            </div>
            <p class="sub" id="sub">书签库文件夹的卡片视图 · 改动即时落库</p>
          </div>
          <span id="status"></span>
        </header>

        <section class="panel">
          <div class="phead">
            <span class="ptitle">链接</span>
            <div class="tools">
              <div class="search">
                <span class="ic" id="qic"></span>
                <input id="q" type="search" placeholder="搜索名称 / 域名 / 分组" autocomplete="off" />
                <button id="qx" type="button" title="清空"></button>
              </div>
              <div class="seg" id="sort" role="group" aria-label="排序方式"></div>
              <a class="btn" id="home" href="/">全部书签</a>
              <button class="btn primary" id="add" type="button">添加</button>
            </div>
          </div>
          <div class="chips" id="chips"></div>
          <div id="slot"></div>
          <div id="body"></div>
        </section>

        <p class="foot">
          <kbd>/</kbd> 搜索 · <kbd>Enter</kbd> 打开首个结果 · <kbd>n</kbd> 添加 · <kbd>Esc</kbd> 取消
        </p>
      </div>
    </div>

    <script>
      // 本页 = 书签库任意 folder 的卡片视图：数据源就是 /api/bookmarks，筛出 folder 为
      // <root> 或 <root>::* 的未删除条目，按下一级路径分组渲染。没有独立存储 —— nav.json 已退役。
      // root 由 `?f=<folder>` 指定（书签页每个 folder 节点都挂了这个链接），缺省即 `123`。
      //
      // 与书签页共用同一套写协议：整份 PUT + `If-Match` 条件写，409 提示并重载。
      // 因此这里必须持有**完整的 STORE**（含其他 folder 与墓碑），只渲染其中的子集；
      // 写回时丢掉任何一部分，都等于替另一端做了删除。
      const $ = (id) => document.getElementById(id);
      const API = "/api/bookmarks";
      // 导航域下任意路径都渲染本页（Worker 的 host 路由），故「全部书签」必须跳回主域；
      // 主域下用相对路径，本地桩调试才走得通。
      const NAV_HOST = "123.yigegongjiang.com";
      const SCHEMA_VERSION = 4; // 与 CLI CURRENT_VERSION / Worker BOOKMARKS_VERSION 对齐
      const DEFAULT_SOURCE = "default";
      const SEP = "::"; // folder 层级分隔符，与 CLI FOLDER_SEP 一致（data-model §5）
      const DEFAULT_ROOT = "123"; // 缺省视图 = 个人导航
      /// 视图根 folder。`::` 在 query 里合法，无需额外转义规则；空值回落缺省。
      const ROOT = (new URLSearchParams(location.search).get("f") || "").trim() || DEFAULT_ROOT;
      const UNGROUPED = "未分组";
      const LS_SORT = "jj-nav-sort";
      const PALETTE = [
        "#7c8bff",
        "#2dd4bf",
        "#4ade80",
        "#fbbf24",
        "#fb923c",
        "#f87171",
        "#f472b6",
        "#c084fc",
      ];
      const SORTS = [
        ["group", "分组", "按分组分区展示"],
        ["recent", "最近", "按添加时间"],
        ["name", "名称", "按名称"],
      ];
      const ICONS = {
        search:
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>',
        plus: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        pencil:
          '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
        close:
          '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
      };

      let STORE = { version: SCHEMA_VERSION, sources: {} }; // 完整书签库，写回用
      let etag = null; // 条件写凭据；null = 远端对象尚不存在
      let links = []; // STORE 的派生视图：{ id, source, name, url, group, createdAt }
      let sortMode = SORTS.some((s) => s[0] === localStorage.getItem(LS_SORT))
        ? localStorage.getItem(LS_SORT)
        : "group";
      let filter = null; // null = 全部；"" = 未分组；其他 = 分组名
      let query = "";
      let form = null; // { id:number|null, name, url, group, err }
      let flashUrl = null;
      let saving = false;
      let statusTimer = null;

      // ---------- 工具 ----------
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }
      function iconBtn(cls, name, title) {
        const b = el("button", cls);
        b.type = "button";
        b.title = title;
        b.setAttribute("aria-label", title);
        b.innerHTML = ICONS[name];
        return b;
      }
      function host(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return "";
        }
      }
      function hash(s) {
        let h = 0;
        for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0;
        return h;
      }
      /// 卡片配色由域名散列而来：确定、零存储。书签模型没有 color 字段，也不该为配色加一个。
      function autoColor(url) {
        return PALETTE[hash(host(url) || url) % PALETTE.length];
      }

      // ---------- folder ⇄ 分组 ----------
      /// 分组名 = folder 相对 root 的剩余路径（`123::JJ` → `JJ`）；挂在 root 本身 = 未分组。
      function groupOf(folder) {
        if (folder === ROOT) return "";
        const rest = folder.slice(ROOT.length + SEP.length);
        return rest === UNGROUPED ? "" : rest;
      }
      /// 未分组的落点取决于 root 当前形态：root 下已经有子文件夹时挂 `<root>::未分组`，
      /// 否则直接挂 `<root>`。书签只能挂叶子 folder，被占用的路径之间不得互为祖先
      /// （data-model §5）—— 一律挂 `<root>::未分组` 会让原本直接挂在 root 上的条目全部违规。
      function folderOf(group) {
        if (group) return ROOT + SEP + group;
        return links.some((l) => l.group) ? ROOT + SEP + UNGROUPED : ROOT;
      }
      function inScope(folder) {
        return folder === ROOT || folder.startsWith(ROOT + SEP);
      }

      // ---------- 加载 / 保存 ----------
      async function load() {
        try {
          const r = await fetch(API, { cache: "no-store" });
          if (!r.ok) throw new Error(r.status);
          etag = r.headers.get("ETag");
          const data = await r.json();
          const sources = {};
          if (data && data.sources && typeof data.sources === "object" && !Array.isArray(data.sources)) {
            for (const [name, list] of Object.entries(data.sources)) {
              sources[name.trim() || DEFAULT_SOURCE] = Array.isArray(list) ? list : [];
            }
          }
          STORE = { version: SCHEMA_VERSION, sources };
          links = [];
          for (const [source, list] of Object.entries(STORE.sources)) {
            for (const b of list) {
              if (b.deleted || !inScope(b.folder || "")) continue;
              links.push({
                id: b.id,
                source,
                name: b.title || "",
                url: b.url || "",
                group: groupOf(b.folder || ""),
                createdAt: b.created || 0,
              });
            }
          }
          renderAll();
        } catch (e) {
          const b = $("body");
          b.textContent = "";
          const wrap = el("div", "none", `加载失败（${e.message}）　`);
          const retry = el("button", "btn", "重试");
          retry.type = "button";
          retry.addEventListener("click", load);
          wrap.appendChild(retry);
          b.appendChild(wrap);
        }
      }

      /// 整份写回 + 条件写。成功后重新 load()：页面状态直接取自服务端，既不本地重算派生字段
      /// （`*_jst` 由 Worker 生成），也顺带吸收 CLI sync 在此期间的写入。
      async function save(label) {
        if (saving) return false;
        saving = true;
        setStatus(`${label}…`);
        try {
          const headers = { "content-type": "application/json" };
          if (etag) headers["If-Match"] = etag;
          const r = await fetch(API, { method: "PUT", headers, body: JSON.stringify(STORE) });
          if (r.status === 409) {
            await load();
            // 提示必须在 load 之后设：load 成功会清状态，先设会被抹掉，
            // 用户就会以为存上了，而这次改动其实已被丢弃。
            setStatus("数据已在别处更新，已重载；本次改动未保存", { err: true });
            return false;
          }
          if (!r.ok) throw new Error(`${r.status} ${(await r.text()).trim()}`);
          await load();
          setStatus("已保存", { fade: true });
          return true;
        } catch (e) {
          await load();
          setStatus(`保存失败（${e.message}），未保存`, { err: true });
          return false;
        } finally {
          saving = false;
        }
      }

      function setStatus(text, opts = {}) {
        clearTimeout(statusTimer);
        const s = $("status");
        s.textContent = text;
        s.className = opts.err ? "err" : "";
        if (opts.fade) statusTimer = setTimeout(() => (s.textContent = ""), 2000);
      }

      // ---------- STORE 变更（都在 save() 之前就地改） ----------
      function findRecord(id) {
        for (const [source, list] of Object.entries(STORE.sources)) {
          const index = list.findIndex((b) => b.id === id);
          if (index >= 0) return { source, list, index, record: list[index] };
        }
        return null;
      }
      /// 新链接跟随本 folder 既有条目的 source，folder 才不会被拆到两个 source 里；
      /// 空 folder（第一条）落 default，与 CLI `apply <URL>` 的落点一致。
      function targetSource() {
        return links.length ? links[0].source : DEFAULT_SOURCE;
      }

      /// 与 CLI data-model §7 一致：id = 当前 Unix 毫秒，冲突 +1。墓碑也占 id，不可复用。
      function freshId() {
        const used = new Set(Object.values(STORE.sources).flat().map((b) => b.id));
        let id = Date.now();
        while (used.has(id)) id++;
        return id;
      }

      // ---------- 视图派生 ----------
      function groupCounts() {
        const m = new Map();
        for (const l of links) m.set(l.group, (m.get(l.group) || 0) + 1);
        return m;
      }
      /// 分组顺序 = 名称升序（书签模型不存展示顺序），未分组恒在末尾。
      function orderedGroups() {
        const c = groupCounts();
        const gs = [...c.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b));
        if (c.get("")) gs.push("");
        return gs;
      }
      function matches(l, q) {
        return (
          l.name.toLowerCase().includes(q) ||
          l.url.toLowerCase().includes(q) ||
          l.group.toLowerCase().includes(q)
        );
      }
      function visible() {
        let out = links.slice();
        if (filter !== null) out = out.filter((l) => l.group === filter);
        if (query) {
          const q = query.toLowerCase();
          out = out.filter((l) => matches(l, q));
        }
        const byName = (a, b) => (a.name || a.url).localeCompare(b.name || b.url);
        if (sortMode === "recent") out.sort((a, b) => b.createdAt - a.createdAt || byName(a, b));
        else out.sort(byName);
        return out;
      }
      const grouped = () => sortMode === "group" && filter === null && !query;

      // ---------- 渲染 ----------
      function renderAll() {
        renderHeading();
        renderSort();
        renderChips();
        renderSlot();
        renderList();
      }

      function renderHeading() {
        const leaf = ROOT.split(SEP).pop();
        $("title").textContent = leaf;
        $("logo").textContent = [...leaf][0].toUpperCase();
        document.title = leaf === DEFAULT_ROOT ? "123" : `${leaf} · 123`;
        $("sub").textContent = `书签库 ${ROOT} 的卡片视图 · 改动即时落库`;
      }

      function renderSort() {
        const box = $("sort");
        box.textContent = "";
        for (const [key, label, tip] of SORTS) {
          const b = el("button", key === sortMode ? "on" : "", label);
          b.type = "button";
          b.title = tip;
          b.setAttribute("aria-pressed", String(key === sortMode));
          b.addEventListener("click", () => {
            sortMode = key;
            localStorage.setItem(LS_SORT, key);
            renderSort();
            renderList();
          });
          box.appendChild(b);
        }
      }

      function renderChips() {
        const box = $("chips");
        box.textContent = "";
        const counts = groupCounts();
        const total = links.length;
        $("count").textContent = total ? `${total} 个链接 · ${orderedGroups().filter(Boolean).length} 组` : "空";
        if (!total) return;
        box.appendChild(chip("全部", total, null));
        for (const g of orderedGroups()) chip(g || UNGROUPED, counts.get(g), g, box);
        function chip(label, n, key, parent) {
          const b = el("button", "chip" + (filter === key ? " on" : ""));
          b.type = "button";
          b.setAttribute("aria-pressed", String(filter === key));
          b.appendChild(el("span", "", label));
          b.appendChild(el("span", "n", String(n)));
          b.addEventListener("click", () => {
            filter = filter === key ? null : key;
            renderChips();
            renderList();
          });
          if (parent) parent.appendChild(b);
          return b;
        }
      }

      function renderList() {
        const body = $("body");
        body.textContent = "";
        const items = visible();

        if (!links.length) {
          const b = el("button", "empty", `${ROOT} 下还没有链接 —— 点这里添加第一条`);
          b.type = "button";
          b.addEventListener("click", () => openForm(null));
          body.appendChild(b);
          return;
        }
        if (!items.length) {
          body.appendChild(el("div", "none", query ? `没有匹配「${query}」的链接` : "该分组为空"));
          return;
        }

        if (grouped()) {
          for (const g of orderedGroups()) {
            body.appendChild(section(g, items.filter((l) => l.group === g)));
          }
        } else {
          const grid = el("div", "grid");
          for (const l of items) grid.appendChild(cell(l));
          body.appendChild(grid);
        }
        if (flashUrl) {
          const target = body.querySelector(".flash");
          if (target) target.scrollIntoView({ block: "nearest", behavior: "smooth" });
          flashUrl = null;
        }
      }

      function section(g, items) {
        const sec = el("div", "sec");
        const head = el("div", "shead");
        const title = el("h2", "", g || UNGROUPED);
        head.appendChild(title);
        head.appendChild(el("span", "n", String(items.length)));
        if (g) {
          const ren = iconBtn("iconbtn", "pencil", "重命名分组");
          ren.addEventListener("click", () => startRename(head, title, ren, g));
          head.appendChild(ren);
        }
        sec.appendChild(head);
        const grid = el("div", "grid");
        for (const l of items) grid.appendChild(cell(l));
        sec.appendChild(grid);
        return sec;
      }

      function startRename(head, title, btn, g) {
        const input = el("input", "srename");
        input.value = g;
        title.replaceWith(input);
        btn.style.display = "none";
        input.focus();
        input.select();
        let done = false;
        const finish = (commit) => {
          if (done) return;
          done = true;
          const next = input.value.trim();
          if (commit && next && next !== g) renameGroup(g, next);
          else renderList();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") finish(true);
          if (e.key === "Escape") finish(false);
        });
        input.addEventListener("blur", () => finish(true));
      }

      /// 重命名分组 = 把该组每条记录的 folder 换掉（等价于 CLI 的 `mv`）。
      async function renameGroup(from, to) {
        const now = Date.now();
        for (const l of links.filter((x) => x.group === from)) {
          const found = findRecord(l.id);
          if (!found) continue;
          found.record.folder = folderOf(to);
          found.record.updated = now; // LWW 依据
        }
        if (filter === from) filter = to;
        await save("重命名中");
      }

      function cell(l) {
        const c = el("div", "cell");
        if (flashUrl && l.url === flashUrl) c.classList.add("flash");

        const a = el("a", "card");
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.draggable = false;
        const name = l.name.trim() || host(l.url) || l.url;
        a.title = `${name}\n${l.url}`;

        const m = el("span", "mark", [...name][0].toUpperCase());
        m.style.background = autoColor(l.url);
        a.appendChild(m);

        const b = el("span", "cbody");
        b.appendChild(el("span", "cname", name));
        const meta = el("span", "cmeta");
        const h = host(l.url);
        if (h && h !== name) meta.appendChild(el("span", "chost", h));
        if (l.group && !grouped()) meta.appendChild(el("span", "ctag", "#" + l.group));
        b.appendChild(meta);
        a.appendChild(b);
        c.appendChild(a);

        const ops = el("div", "ops");
        const edit = iconBtn("op", "pencil", "编辑");
        edit.addEventListener("click", () => openForm(l.id));
        const del = iconBtn("op del", "close", "删除");
        del.addEventListener("click", async () => {
          if (!confirm(`删除「${name}」？`)) return;
          const found = findRecord(l.id);
          if (!found) return;
          // 软删除：置墓碑并抬 updated，绝不从数组里抹掉（data-model §12）
          found.record.deleted = true;
          found.record.updated = Date.now();
          await save("删除中");
        });
        ops.append(edit, del);
        c.appendChild(ops);
        return c;
      }

      // ---------- 添加 / 编辑表单 ----------
      function openForm(id) {
        const l = id === null ? null : links.find((x) => x.id === id);
        form = {
          id: l ? l.id : null,
          name: l ? l.name : "",
          url: l ? l.url : "",
          group: l ? l.group : filter || "",
          err: "",
        };
        renderSlot();
        const first = $("slot").querySelector(l ? ".in.name" : ".in.url");
        if (first) first.focus();
      }
      function closeForm() {
        form = null;
        renderSlot();
      }

      function renderSlot() {
        const slot = $("slot");
        slot.textContent = "";
        if (!form) return;
        const f = el("form", "editor");
        const row = el("div", "frow");
        const mk = (cls, ph, value, key) => {
          const i = el("input", "in " + cls);
          i.placeholder = ph;
          i.value = value;
          i.autocomplete = "off";
          i.addEventListener("input", () => (form[key] = i.value));
          return i;
        };
        row.appendChild(mk("url", "https://example.com", form.url, "url"));
        row.appendChild(mk("name", "名称（留空则用域名）", form.name, "name"));
        const group = mk("group", "分组（留空 = 未分组）", form.group, "group");
        group.setAttribute("list", "groups");
        row.appendChild(group);
        const list = el("datalist");
        list.id = "groups";
        for (const g of orderedGroups().filter(Boolean)) {
          const o = el("option");
          o.value = g;
          list.appendChild(o);
        }
        row.appendChild(list);
        f.appendChild(row);

        if (form.err) f.appendChild(el("div", "ferr", form.err));
        // 落点提示随分组输入实时更新：整体 renderSlot 会丢焦点，故只改这一行文字
        const where = (g) => `保存到书签库 ${targetSource()} source 的 ${folderOf(g)} 下`;
        const hint = el("div", "fhint", where(form.group));
        group.addEventListener("input", () => (hint.textContent = where(group.value.trim())));
        f.appendChild(hint);
        const act = el("div", "fact");
        const cancel = el("button", "btn", "取消");
        cancel.type = "button";
        cancel.addEventListener("click", closeForm);
        const ok = el("button", "btn primary", form.id === null ? "添加" : "保存");
        ok.type = "submit";
        act.append(cancel, ok);
        f.appendChild(act);
        f.addEventListener("submit", (e) => {
          e.preventDefault();
          submitForm();
        });
        slot.appendChild(f);
      }

      async function submitForm() {
        const url = form.url.trim();
        if (!url) {
          form.err = "URL 不能为空";
          renderSlot();
          return;
        }
        const group = form.group.trim();
        const title = form.name.trim() || url; // 与 CLI 一致：无标题时用 URL 占位
        const now = Date.now();
        const editing = form.id;
        flashUrl = url;

        if (editing === null) {
          const record = {
            id: freshId(),
            title,
            url,
            excerpt: "",
            note: "",
            folder: folderOf(group),
            deleted: false,
            created: now,
            created_jst: "", // 派生字段由 Worker 依数字主字段重算
            updated: now,
            updated_jst: "",
            last_visited: 0,
            last_visited_jst: "",
          };
          (STORE.sources[targetSource()] ||= []).push(record);
        } else {
          const found = findRecord(editing);
          if (!found) return;
          Object.assign(found.record, { title, url, folder: folderOf(group) });
          found.record.updated = now; // LWW 依据
        }
        form = null;
        await save(editing === null ? "添加中" : "保存中");
      }

      // ---------- 事件 ----------
      $("qic").innerHTML = ICONS.search;
      $("qx").innerHTML = ICONS.close;
      $("add").innerHTML = ICONS.plus + "<span>添加</span>";
      $("home").href = location.hostname === NAV_HOST ? "https://jj-bookmark.yigegongjiang.com/" : "/";
      $("add").addEventListener("click", () => openForm(null));
      $("q").addEventListener("input", () => {
        query = $("q").value.trim();
        $("qx").style.display = query ? "" : "none";
        renderList();
      });
      $("q").addEventListener("keydown", (e) => {
        if (e.key === "Escape") clearQuery();
        if (e.key === "Enter") {
          const first = visible()[0];
          if (first) window.open(first.url, "_blank", "noopener,noreferrer");
        }
      });
      $("qx").addEventListener("click", clearQuery);
      function clearQuery() {
        $("q").value = "";
        query = "";
        $("qx").style.display = "none";
        renderList();
        $("q").focus();
      }
      $("qx").style.display = "none";

      document.addEventListener("keydown", (e) => {
        const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
        if (e.key === "/" && !typing) {
          e.preventDefault();
          $("q").focus();
        } else if (e.key === "n" && !typing && !form) {
          e.preventDefault();
          openForm(null);
        } else if (e.key === "Escape" && form && !typing) {
          closeForm();
        }
      });

      load();
    </script>
  </body>
</html>
