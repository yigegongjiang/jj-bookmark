# Cloudflare Worker：/api/bookmarks（读写 R2 bookmarks.json）+ 两张页：/ 全库列表、/123 folder 卡片视图。
# 认证：Cloudflare Access（Google IdP）边缘网关 + Worker 校验 Access JWT（见 README / src/index.js）。
# Worker 名 = jj-bookmark（与目录名 jj-bookmark-web 不同，对齐 Access 应用所配域名）。
name = "jj-bookmark"
main = "src/index.js"
compatibility_date = "2026-07-17"

# 自定义域 `jj-bookmark.yigegongjiang.com` + `123.yigegongjiang.com`（导航页，host 路由见 src/index.js）
# 均已在 Cloudflare 侧挂载，不写 routes：GHA deploy 的 API token 仅 Workers + R2 权限，
# 声明域名会因权限不足而部署失败（见 README）。
# 关闭 workers.dev 域（production + preview）缩小攻击面 —— 硬约束，MUST NOT 打开。
# 配套要求：Access 应用的 destinations MUST NOT 残留任何 `*.workers.dev`，否则多域跨站 SSO
# 的 `/cdn-cgi/access/authorized` 会挑中该不可达域 → 404，第二个自定义域永远登不进（见 README「前置」）。
workers_dev = false
preview_urls = false

# 静态资源（preview page）。run_worker_first=true → 所有请求先进 Worker（含静态资源），
# 由 Worker 统一做 Access JWT 校验后再经 env.ASSETS.fetch() 返回，确保页面也不裸奔。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# R2 绑定：与 CLI `sync` 双向同步的 bookmarks.json 落在此 bucket，Worker 读写。
# bucket 需在 Cloudflare 侧预先创建（见 README），否则 deploy 校验失败。
[[r2_buckets]]
binding = "BOOKMARKS"
bucket_name = "jj-bookmark"

# Cloudflare Access（Google 登录）参数——非机密（AUD 是受众标识，非密钥；team domain 公开）。
# 二者齐备时 Worker 校验 Cf-Access-Jwt-Assertion；缺任一则跳过校验、仅靠边缘 Access。
[vars]
CF_ACCESS_TEAM_DOMAIN = "https://yigegongjiang.cloudflareaccess.com"
CF_ACCESS_AUD = "27e81cfdbe1bade3160d54d81393ee010c331a756c8cb472a68e0b4ab2ffa31f"
